server {
    listen 80;
    root /usr/share/nginx/html;

    # A single page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri /index.html;
    }

    # Hashed assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
