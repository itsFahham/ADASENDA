name: release

# Push a tag to cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: js
            context: ./services/js
          - name: go
            context: ./services/go
          - name: frontend
            context: ./frontend

    steps:
      - uses: actions/checkout@v4

      # Image names may not contain capitals, the repository name does.
      - id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercases the owner and turns the tag into a version, since image names
      # may not contain capitals.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: images

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Container images for this release:

            ```
            docker pull ghcr.io/${{ steps.repo.outputs.name }}-js:${{ github.ref_name }}
            docker pull ghcr.io/${{ steps.repo.outputs.name }}-go:${{ github.ref_name }}
            docker pull ghcr.io/${{ steps.repo.outputs.name }}-frontend:${{ github.ref_name }}
            ```
